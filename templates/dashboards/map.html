{% extends "base.html" %}
{% load static %}
{% block title %}Map | {{ app_name }}{% endblock %}
{% block extra_head %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
{% endblock %}
{% block content %}
<div class="grid gap-5">
  <section class="flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
    <div>
      <h1 class="text-3xl font-semibold text-slate-950">Worker map</h1>
      <p class="mt-1 text-sm text-slate-600">Mapped records with captured or simulated GPS coordinates</p>
    </div>
    <a class="btn-secondary" href="{% url 'workers:list' %}">Worker list</a>
  </section>
  <section class="panel">
    <div id="worker-map" class="map-full" aria-label="Map of worker records"></div>
  </section>
</div>
{% endblock %}
{% block extra_js %}
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="{% static 'js/maps.js' %}?v=20260907-leaflet-v3"></script>
<script>
  const mapMarkers = JSON.parse('{{ map_markers_json|escapejs }}');
  window.DLDMSMaps.renderLocalMap('worker-map', mapMarkers, {
    title: 'Worker map',
    emptyMessage: 'No worker records with captured GPS coordinates yet.'
  });
</script>
{% endblock %}
