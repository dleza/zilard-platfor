{% extends "base.html" %}
{% load form_tags %}
{% block title %}Verify code | {{ app_name }}{% endblock %}
{% block content %}
<div class="mx-auto grid max-w-md gap-6 rounded-lg border border-slate-200 bg-white p-6 shadow-sm">
  <div>
    <h1 class="text-2xl font-semibold text-slate-950">Verify code</h1>
    <p class="mt-1 text-sm text-slate-600">{{ pending_user.username }}</p>
  </div>
  <form method="post" class="grid gap-4">
    {% csrf_token %}
    {% render_field form.code %}
    <button class="btn-primary w-full justify-center" type="submit">Verify</button>
  </form>
</div>
{% endblock %}
